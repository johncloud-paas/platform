name: core

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    privileged: true
    environment:
      LOG_LEVEL: warning
      # Core info & inspection
      INFO: 1
      VERSION: 1
      EVENTS: 1
      PING: 1
      # Containers (read-only operations)
      CONTAINERS: 1
      # Images (list & inspect)
      IMAGES: 1
      # Volumes (list & inspect)
      VOLUMES: 1
      # Networks (list & inspect)
      NETWORKS: 1
      # Nodes & Swarm info (read-only)
      NODES: 0
      SERVICES: 0
      TASKS: 0
      # System-wide data
      SYSTEM: 0
      EXEC: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro

  pangolin:
    image: docker.io/fosrl/pangolin:ee-latest
    user: 0:0
    restart: unless-stopped
    # ports:
    #   - "3002:3002"  # Temporary for setup
    volumes:
      - ./pangolin:/app/config
      - $JOHNCLOUD_ROOT/traefik/letsencrypt:/app/config/letsencrypt:ro
      - $JOHNCLOUD_ROOT/traefik/GeoLite2:/app/config/GeoLite2:ro
    environment:
      - NODE_ENV=prod
      - EMAIL_SMTP_PASS=$EMAIL_PASSWORD
      - SERVER_SECRET=$PANGOLIN_SERVER_SECRET
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1"]
      interval: "3s"
      timeout: "3s"
      retries: 15
    labels:
      - "homepage.group=Platform"
      - "homepage.name=Pangolin"
      - "homepage.icon=pangolin.svg"
      - "homepage.href=https://pangolin.$HOST"
      - "homepage.description=Remote access to anything, anywhere"

  gerbil:
    image: docker.io/fosrl/gerbil:latest
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    # environment:
    #   - EMAIL_SMTP_PASS=$EMAIL_PASSWORD
    #   - SERVER_SECRET=$PANGOLIN_SERVER_SECRET
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./pangolin/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 127.0.0.1:8081:8080
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80

  newt:
    image: fosrl/newt:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_SOCKET=unix:///var/run/docker.sock
      - EMAIL_SMTP_PASS=$EMAIL_PASSWORD
      - SERVER_SECRET=$PANGOLIN_SERVER_SECRET
      - PANGOLIN_ENDPOINT=http://pangolin:3000
      - NEWT_ID=$NEWT_ID
      - NEWT_SECRET=$NEWT_SECRET

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate
    restart: unless-stopped
    environment:
      - 'GEOIPUPDATE_ACCOUNT_ID=$GEOIPUPDATE_ACCOUNT_ID'							# Account ID
      - 'GEOIPUPDATE_LICENSE_KEY=$GEOIPUPDATE_LICENSE_KEY'							# API key
      - 'GEOIPUPDATE_EDITION_IDS=GeoLite2-Country GeoLite2-City GeoLite2-ASN'	# Which dbs should be downloaded
      - 'GEOIPUPDATE_FREQUENCY=72'							# Update intervall in hours
    volumes:
      - '$JOHNCLOUD_ROOT/traefik/GeoLite2:/usr/share/GeoIP'

  traefik:
    image: traefik:latest
    user: 0:0
    depends_on:
      docker-socket-proxy:
        condition: service_started
      gerbil:
        condition: service_started
      pangolin:
        condition: service_healthy
    network_mode: service:gerbil # Ports appear on the gerbil service
    restart: unless-stopped
    environment:
    # https://www.ovh.com/auth/api/createToken
    # https://eu.api.ovh.com/console/?section=%2Fme&branch=v1#delete-/me/api/application/-applicationId-
      - "TZ=$TZ"
    command:
      - --configFile=/conf.d/static_config.yml
    volumes:
      - ./pangolin/traefik/logs:/var/log/traefik
      - $JOHNCLOUD_ROOT/traefik/letsencrypt:/letsencrypt
      # - $JOHNCLOUD_ROOT/traefik/plugins:/plugins-storage
      - $JOHNCLOUD_ROOT/traefik/conf.d:/conf.d
    labels:
      - "homepage.group=Platform"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.svg"
      - "homepage.href=https://traefik.$HOST/dashboard/"
      - "homepage.description=Traefik reverse proxy"
  
  certdumper:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    restart: unless-stopped
    depends_on:
      - traefik
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $JOHNCLOUD_ROOT/traefik/letsencrypt:/traefik:ro
      - $JOHNCLOUD_ROOT/traefik/certs:/output
      
  dockhand:
    image: fnsys/dockhand:latest
    restart: unless-stopped
    environment:
      - PUID=1000  # Your user ID (run: id -u)
      - PGID=1000  # Your group ID (run: id -g)
    group_add:
      - "$DOCKER_GROUP_ID"  # Replace with your host's Docker GID
    volumes:
      - $JOHNCLOUD_ROOT/dockhand/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - pangolin.public-resources.dockhand.name=dockhand
      - pangolin.public-resources.dockhand.full-domain=dockhand.$HOST
      - pangolin.public-resources.dockhand.protocol=http
      - pangolin.public-resources.dockhand.ssl=true
      - pangolin.public-resources.dockhand.targets[0].method=http
      - pangolin.public-resources.dockhand.targets[0].port=3000
      
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.enabled=true
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.hostname=core-dockhand-1
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.port=3000
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.path=/health
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.method=GET
      # - pangolin.public-resources.dockhand.targets[0].healthcheck.status=200

      # # Page de maintenance en mode automatique
      # - pangolin.public-resources.dockhand.maintenance.enabled=true
      # - pangolin.public-resources.dockhand.maintenance.type=automatic
      # - pangolin.public-resources.dockhand.maintenance.title=Maintenance en cours
      # - pangolin.public-resources.dockhand.maintenance.message=Le service est temporairement indisponible.

      - "homepage.group=Platform"
      - "homepage.name=Dockhand"
      - "homepage.icon=https://dockhand.pro/images/logo-dark.webp"
      - "homepage.href=https://dockhand.$HOST"
      - "homepage.description=Modern Docker management for everyone"

  # portainer:
