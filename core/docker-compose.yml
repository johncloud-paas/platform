  #  volumes:
  #    - /var/run/docker.sock:/var/run/docker.sock
  #    - $JOHNCLOUD_ROOT/portainer:/data
  #  labels:
  #    - "pangolin.public-resources.portainer.name=portainer"
  #    - "pangolin.public-resources.portainer.full-domain=portainer.$HOST"
  #    - "pangolin.public-resources.portainer.protocol=http"
  #    - "pangolin.public-resources.portainer.ssl=true"
  #    - "pangolin.public-resources.portainer.targets[0].method=http"
  #    - "pangolin.public-resources.portainer.targets[0].port=9000"
  #    - "homepage.group=Platform"
  #    - "homepage.name=Portainer"
  #    - "homepage.icon=portainer.svg"
  #    - "homepage.href=https://portainer.$HOST"
  #    - "homepage.description=Modern Docker management for everyone"
      
networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    
