api:
  insecure: false
  dashboard: true

providers:
  http:
    endpoint: "http://pangolin:3001/api/v1/traefik-config"
    # endpoint: "http://mwmanager:3456/api/v1/traefik-config"
    pollInterval: "5s"
  file:
    directory: "/conf.d/rules"
    watch: true

experimental:
  plugins:
    badger:
      moduleName: "github.com/fosrl/badger"
      version: "v1.3.1"
# - --experimental.plugins.mtlswhitelist.moduleName=github.com/smerschjohann/mtlswhitelist
# - --experimental.plugins.mtlswhitelist.version=v0.0.4
  # localPlugins:
  #   thyrea:
  #     moduleName: "github.com/thyrea/thyrea-traefik-shim"

log:
  level: "INFO"
  format: "json"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: "json"
  bufferingSize: 100
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Authorization: redact

certificatesResolvers:
  letsencrypt:
    acme:
      httpChallenge:
        entryPoint: web
      email: "$EMAIL_LETS_ENCRYPT"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "30m"
    http:
      # middlewares:
      #   - thyrea@file
      tls:
        certResolver: "letsencrypt"
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedQuestionMark: true

serversTransport:
  insecureSkipVerify: true

ping:
  entryPoint: "web"
  