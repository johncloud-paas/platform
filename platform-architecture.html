<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JohnCloud Platform — Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 964px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Platform overview</p>
    <h1>JohnCloud Platform — four stacks, one ingress, routed through Traefik</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 964 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-arch-title platform-arch-desc">
        <title id="platform-arch-title">JohnCloud Platform Architecture</title>
        <desc id="platform-arch-desc">Public traffic enters the Gerbil WireGuard gateway and is terminated by Traefik, which pulls its routing configuration from the Pangolin control plane and fans requests out to the authentik, backup and example application stacks, while the monitoring stack observes the whole platform.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONES (drawn first) ============ -->
        <!-- CORE stack -->
        <rect x="232" y="96" width="360" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="300" y="100" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="412" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CORE · INGRESS + CONTROL PLANE</text>

        <!-- AUTHENTIK stack -->
        <rect x="700" y="288" width="216" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="748" y="292" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="808" y="301" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AUTHENTIK · SSO</text>

        <!-- BACKUP stack -->
        <rect x="700" y="424" width="216" height="92" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="772" y="428" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="808" y="437" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKUP</text>

        <!-- MONITORING stack -->
        <rect x="232" y="588" width="684" height="108" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="508" y="592" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="601" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MONITORING · OBSERVABILITY</text>

        <!-- ============ ARROWS (drawn before nodes) ============ -->
        <!-- A1 Internet -> Gerbil : HTTPS / WG -->
        <line x1="198" y1="178" x2="250" y2="178" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="200" y="164" width="52" height="11" rx="2" fill="#f5f5f5"/>
        <text x="226" y="172" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS·WG</text>

        <!-- A2 Gerbil -> Traefik : SHARED NETNS (vertical) -->
        <line x1="331" y1="216" x2="331" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="339" y="250" width="80" height="11" rx="2" fill="#f5f5f5"/>
        <text x="343" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">SHARED NETNS</text>

        <!-- A3 Pangolin -> Traefik : CONFIG (vertical, dashed link, up) -->
        <line x1="356" y1="436" x2="356" y2="376" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="362" y="400" width="42" height="11" rx="2" fill="#f5f5f5"/>
        <text x="366" y="408" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">CONFIG</text>

        <!-- A4 Traefik -> whoami : ROUTE (accent — the example path) -->
        <path d="M406,312 H560 Q568,312 568,304 V190 Q568,182 576,182 H716" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="540" y="238" width="46" height="11" rx="2" fill="#f5f5f5"/>
        <text x="563" y="246" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

        <!-- A5 Traefik -> Authentik : FORWARD-AUTH (straight horizontal, dashed link) -->
        <line x1="406" y1="348" x2="716" y2="348" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <rect x="556" y="334" width="78" height="11" rx="2" fill="#f5f5f5"/>
        <text x="595" y="342" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD-AUTH</text>

        <!-- A6 Traefik -> Backup : ROUTE (elbow) -->
        <path d="M406,364 H540 Q548,364 548,372 V472 Q548,480 556,480 H716" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="524" y="430" width="46" height="11" rx="2" fill="#f5f5f5"/>
        <text x="547" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

        <!-- A7 Monitoring -> core : SCRAPE / TAIL (vertical, dashed) -->
        <line x1="500" y1="588" x2="500" y2="536" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="508" y="556" width="86" height="11" rx="2" fill="#f5f5f5"/>
        <text x="512" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">SCRAPE · TAIL</text>

        <!-- ============ NODES ============ -->

        <!-- N1 Internet (input) -->
        <rect x="48" y="142" width="150" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="142" width="150" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="60" y="156" width="56" height="13" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/>
        <text x="66" y="165" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CLIENTS</text>
        <text x="60" y="186" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Internet</text>
        <text x="60" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">browsers · WG peers</text>

        <!-- N2 Gerbil (focal — gateway) -->
        <rect x="256" y="140" width="150" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="140" width="150" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="268" y="154" width="60" height="13" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="274" y="163" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">GATEWAY</text>
        <text x="268" y="184" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Gerbil</text>
        <text x="268" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">:80 :443 · :51820/udp</text>
        <text x="268" y="209" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">WireGuard tunnel</text>

        <!-- N3 Traefik (service — reverse proxy) -->
        <rect x="256" y="300" width="150" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="300" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="314" width="92" height="13" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="274" y="323" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">REVERSE PROXY</text>
        <text x="268" y="344" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Traefik</text>
        <text x="268" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">http provider · ACME</text>
        <text x="268" y="369" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">+ certdumper</text>

        <!-- N4 Pangolin (service — control plane) -->
        <rect x="256" y="436" width="180" height="78" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="436" width="180" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="450" width="94" height="13" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="274" y="459" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONTROL PLANE</text>
        <text x="268" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Pangolin</text>
        <text x="268" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">resources API · dashboard</text>
        <text x="268" y="505" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">Newt agent reads docker labels</text>

        <!-- N5 whoami (focal — example app) -->
        <rect x="716" y="140" width="184" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="140" width="184" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="728" y="154" width="72" height="13" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="734" y="163" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">EXAMPLE APP</text>
        <text x="728" y="184" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">whoami</text>
        <text x="728" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">traefik/whoami · :80</text>
        <text x="728" y="210" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">whoami.$HOST</text>
        <text x="728" y="221" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">auto-registered via labels</text>

        <!-- N6 Authentik (service — identity) -->
        <rect x="716" y="312" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="312" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="326" width="64" height="13" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="734" y="335" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">IDENTITY</text>
        <text x="728" y="356" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Authentik</text>
        <text x="728" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">server · worker · :9000</text>
        <text x="728" y="381" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">postgresql · redis</text>

        <!-- N7 Backup (service) -->
        <rect x="716" y="448" width="184" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="448" width="184" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="462" width="76" height="13" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="734" y="471" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">DB · FILES</text>
        <text x="728" y="492" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Backup</text>
        <text x="728" y="503" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">databasus · duplicati</text>

        <!-- N8 Monitoring (service — observability, wide) -->
        <rect x="256" y="612" width="636" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="612" width="636" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="626" width="92" height="13" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="274" y="635" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">METRICS · LOGS</text>
        <text x="268" y="656" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Monitoring</text>
        <text x="424" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">VictoriaMetrics · VictoriaLogs · VictoriaTraces</text>
        <text x="424" y="664" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">fluent-bit · suricata · node-exporter · cadvisor</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="48" y1="724" x2="916" y2="724" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <rect x="48" y="744" width="18" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="72" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">focal / example</text>

        <rect x="180" y="744" width="18" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">service</text>

        <rect x="272" y="744" width="18" height="12" rx="3" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="296" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ingress</text>

        <rect x="354" y="744" width="18" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="378" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">stack (docker-compose)</text>

        <line x1="536" y1="750" x2="564" y2="750" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="572" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">example route</text>

        <line x1="672" y1="750" x2="700" y2="750" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="708" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">http / config</text>

        <line x1="808" y1="750" x2="836" y2="750" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="844" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">observe</text>
      </svg>
    </div>
  </div>
</body>
</html>
