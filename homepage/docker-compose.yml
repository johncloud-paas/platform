name: homepage

services:
  provision-config:
    image: ghcr.io/gethomepage/homepage:latest
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/provision-config.sh"]
    volumes:
      - $JOHNCLOUD_ROOT/homepage/config:/app/config # Make sure your local config directory exists
      - ./config:/scripts:ro

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.$HOST,homepage-homepage-1:3000
      - HOMEPAGE_AUTH_ENABLED=true
      - HOMEPAGE_AUTH_SECRET=${HOMEPAGE_AUTH_SECRET:?Missing HOMEPAGE_AUTH_SECRET environment variable}
      - HOMEPAGE_EXTERNAL_URL=https://home.$HOST
      - HOMEPAGE_OIDC_ISSUER=${HOMEPAGE_OIDC_ISSUER:?Missing HOMEPAGE_OIDC_ISSUER environment variable}
      - HOMEPAGE_OIDC_CLIENT_ID=${HOMEPAGE_OIDC_CLIENT_ID:?Missing HOMEPAGE_OIDC_CLIENT_ID environment variable}
      - HOMEPAGE_OIDC_CLIENT_SECRET=${HOMEPAGE_OIDC_CLIENT_SECRET:?Missing HOMEPAGE_OIDC_CLIENT_SECRET environment variable}
      - HOMEPAGE_OIDC_NAME=${HOMEPAGE_OIDC_NAME:?Missing HOMEPAGE_OIDC_NAME environment variable} # (display name)
      - HOMEPAGE_OIDC_SCOPE=${HOMEPAGE_OIDC_SCOPE:-openid email profile} # (defaults to openid email profile)
      - HOMEPAGE_OIDC_AUTO_LOGIN=${HOMEPAGE_OIDC_AUTO_LOGIN:-true}
    depends_on:
      provision-config:
        condition: service_completed_successfully
    volumes:
      - $JOHNCLOUD_ROOT/homepage/config:/app/config # Make sure your local config directory exists
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - pangolin.public-resources.homepage.name=homepage
      - pangolin.public-resources.homepage.full-domain=home.$HOST
      - pangolin.public-resources.homepage.protocol=http
      - pangolin.public-resources.homepage.ssl=true
      - pangolin.public-resources.homepage.targets[0].method=http
      - pangolin.public-resources.homepage.targets[0].port=3000
      
      # - pangolin.public-resources.homepage.targets[0].healthcheck.enabled=true
      # - pangolin.public-resources.homepage.targets[0].healthcheck.hostname=homepage-homepage-1
      # - pangolin.public-resources.homepage.targets[0].healthcheck.port=3000
      # - pangolin.public-resources.homepage.targets[0].healthcheck.path=/api/healthcheck
      # - pangolin.public-resources.homepage.targets[0].healthcheck.method=GET
      # - pangolin.public-resources.homepage.targets[0].healthcheck.status=200

      # # Maintenance page in automatic mode
      # - pangolin.public-resources.homepage.maintenance.enabled=true
      # - pangolin.public-resources.homepage.maintenance.type=automatic
      # - pangolin.public-resources.homepage.maintenance.title=Maintenance in progress
      # - pangolin.public-resources.homepage.maintenance.message=The service is temporarily unavailable.

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    