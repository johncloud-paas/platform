name: authentik

services:
  authentik_server:
    image: 'ghcr.io/goauthentik/server:${AUTHENTIK_TAG}'
    container_name: authentik_server
    restart: unless-stopped
    command: server
    shm_size: 512mb
    environment:
      AUTHENTIK_REDIS__HOST: 'redis'
      AUTHENTIK_POSTGRESQL__HOST: 'core-db-1'
      AUTHENTIK_POSTGRESQL__NAME: 'authentik'
      AUTHENTIK_POSTGRESQL__PASSWORD: '${AUTHENTIK_DB_PASSWORD}'
      AUTHENTIK_POSTGRESQL__USER: 'postgres'
      AUTHENTIK_SECRET_KEY: '${AUTHENTIK_SECRET_KEY}'
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_EMAIL__HOST: '${EMAIL_HOST}'
      AUTHENTIK_EMAIL__PORT: '${EMAIL_PORT}'
      AUTHENTIK_EMAIL__USERNAME: '${EMAIL_USERNAME}'
      AUTHENTIK_EMAIL__PASSWORD: '${EMAIL_PASSWORD}'
      AUTHENTIK_EMAIL__USE_TLS: '${EMAIL_USE_TLS}'
      AUTHENTIK_EMAIL__USE_SSL: '${EMAIL_USE_SSL}'
      AUTHENTIK_EMAIL__TIMEOUT: '${EMAIL_TIMEOUT}'
      AUTHENTIK_EMAIL__FROM: '${EMAIL_FROM}'
    volumes:
      - '$JOHNCLOUD_ROOT/authentik/media:/media'
      - '$JOHNCLOUD_ROOT/authentik/custom-templates:/templates'
      - '$JOHNCLOUD_ROOT/authentik/data:/data'
    labels:
      - pangolin.public-resources.authentik.name=authentik
      - pangolin.public-resources.authentik.full-domain=authentik.$HOST
      - pangolin.public-resources.authentik.protocol=http
      - pangolin.public-resources.authentik.ssl=true
      - pangolin.public-resources.authentik.targets[0].method=http
      - pangolin.public-resources.authentik.targets[0].port=9000
      - "homepage.group=Platform"
      - "homepage.name=Authentik"
      - "homepage.icon=authentik.png"
      - "homepage.href=https://authentik.$HOST/if/admin/"
      - "homepage.description=Identity provider prioritizing security and control of your most sensitive data"
      - "homepage.widget.type=authentik"
      - "homepage.widget.url=https://authentik.$HOST"
      - "homepage.widget.key=$AUTHENTIK_KEY"
      - "homepage.widget.version=2"

  authentik_worker:
    image: 'ghcr.io/goauthentik/server:${AUTHENTIK_TAG}'
    restart: unless-stopped
    command: worker
    shm_size: 512mb
    container_name: authentik_worker
    environment:
      AUTHENTIK_REDIS__HOST: 'redis'
      AUTHENTIK_POSTGRESQL__HOST: 'core-db-1'
      AUTHENTIK_POSTGRESQL__NAME: 'authentik'
      AUTHENTIK_POSTGRESQL__PASSWORD: '${AUTHENTIK_DB_PASSWORD}'
      AUTHENTIK_POSTGRESQL__USER: 'postgres'
      AUTHENTIK_SECRET_KEY: '${AUTHENTIK_SECRET_KEY}'
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_EMAIL__HOST: '${EMAIL_HOST}'
      AUTHENTIK_EMAIL__PORT: '${EMAIL_PORT}'
      AUTHENTIK_EMAIL__USERNAME: '${EMAIL_USERNAME}'
      AUTHENTIK_EMAIL__PASSWORD: '${EMAIL_PASSWORD}'
      AUTHENTIK_EMAIL__USE_TLS: '${EMAIL_USE_TLS}'
      AUTHENTIK_EMAIL__USE_SSL: '${EMAIL_USE_SSL}'
      AUTHENTIK_EMAIL__TIMEOUT: '${EMAIL_TIMEOUT}'
      AUTHENTIK_EMAIL__FROM: '${EMAIL_FROM}'
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock
      - '$JOHNCLOUD_ROOT/authentik/media:/media'
      - '$JOHNCLOUD_ROOT/authentik/certs:/certs'
      - '$JOHNCLOUD_ROOT/authentik/custom-templates:/templates'
      - '$JOHNCLOUD_ROOT/authentik/data:/data'
    
  redis:
    image: redis:8
    environment:
      - TZ=$TZ
      - ENABLE_OVERCOMMIT_MEMORY=true

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    