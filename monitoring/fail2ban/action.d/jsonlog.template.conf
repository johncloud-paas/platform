# jsonlog.template.conf
#
# Rendered by scripts/install-host-security.sh (envsubst substitutes ${JOHNCLOUD_ROOT})
# into /etc/fail2ban/action.d/jsonlog.conf. Edit THIS template and re-run the
# installer — never edit the rendered /etc/fail2ban/action.d/jsonlog.conf.
#
# A LOG-ONLY action: it does NOT touch the firewall. It is attached alongside the
# real nftables banaction (see jail.template.local -> [DEFAULT] action) so every
# ban/unban also appends one JSON line to <jsonlog>. Vector's `file` source tails
# that file and inserts the events into the `security_events` Postgres table.
#
# Fail2ban uses Python %-interpolation, so a literal % must be written %%.
# <name>, <ip>, <failures>, <family>, <port>, <protocol>, <bantime> are Fail2ban
# tags (see the stock cloudflare.conf / dummy.conf actions for the same pattern).

[Definition]

actionstart =
actionstop  =
actioncheck =

# One compact JSON line per ban. $(date -u ...) stamps the event time in UTC;
# <failures>/<bantime> expand to bare numbers (JSON numbers, not strings).
actionban = printf '{"timestamp":"%%s","action":"ban","jail":"<name>","ip":"<ip>","failures":<failures>,"family":"<family>","port":"<port>","protocol":"<protocol>","bantime":<bantime>}\n' "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" >> <jsonlog>

# Unban carries fewer tags (no failure/port context), so keep it minimal.
actionunban = printf '{"timestamp":"%%s","action":"unban","jail":"<name>","ip":"<ip>","family":"<family>"}\n' "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" >> <jsonlog>

[Init]

# Written by the root Fail2ban service; read (read-only) by the rootless Vector
# container, which bind-mounts $JOHNCLOUD_ROOT/security as /var/log/security.
jsonlog = ${JOHNCLOUD_ROOT}/security/fail2ban-events.jsonl
