# Fail2ban action: DROP in the iptables `raw` PREROUTING table.
#
# Why raw/PREROUTING and not the stock iptables-allports (INPUT) action:
# this host runs services inside Docker containers. Traffic to a container is
# FORWARDED (DOCKER-USER chain), never INPUT, so an INPUT rule would miss it.
# raw/PREROUTING is traversed by EVERY inbound packet before the routing
# decision, so a single DROP here blocks both host-destined and
# container-forwarded traffic from a banned source.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban    = ip46tables -w -t raw -I PREROUTING -s <ip> -j DROP
actionunban  = ip46tables -w -t raw -D PREROUTING -s <ip> -j DROP

[Init]
# ip46tables isn't universal; if missing, fail2ban picks v4/v6 per-IP via the
# <family> tag instead. Fallback form (uncomment, comment the two lines above):
# actionban   = <iptables> -w -t raw -I PREROUTING -s <ip> -j DROP
# actionunban = <iptables> -w -t raw -D PREROUTING -s <ip> -j DROP
