# Fail2ban filter for Suricata EVE JSON alerts.
# One JSON object per line; we match alert events and capture the attacker's
# source IP. Scoped to severity 1 (high) by default so low-value noise — e.g.
# the ICMP smoke test (sid 1000001) or legacy-TLS rules in local.rules — does
# NOT get anyone banned. Widen/narrow the regex to taste (see notes below).

[Definition]

# src_ip appears before the nested "alert" object (which carries "severity"),
# so this ordering is reliable for eve.json.
failregex = ^.*"event_type":"alert".*"src_ip":"<HOST>".*"severity":1[,}].*$

ignoreregex =

# --- Tuning -----------------------------------------------------------------
# Ban on ANY alert severity (noisier):
#   failregex = ^.*"event_type":"alert".*"src_ip":"<HOST>".*$
#
# Ban only on specific local SIDs (e.g. inbound SSH attempts, sid 1000002):
#   failregex = ^.*"event_type":"alert".*"src_ip":"<HOST>".*"signature_id":1000002,.*$
#
# datepattern lets fail2ban read the ISO8601 "timestamp" field directly.
datepattern = "timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S
