# Fail2ban filter for the Traefik JSON access log.
#
# Select behaviour from the jail with:  filter = traefik-access[mode=4xx|bot]
# Iterate with:  fail2ban-regex <access.log> /etc/fail2ban/filter.d/traefik-access.conf
#
# A Traefik JSON access line looks like:
#   {"ClientHost":"1.2.3.4", ... ,"DownstreamStatus":404, ... ,"request_User-Agent":"...", ... ,"StartUTC":"2026-11-16T12:34:56Z"}

[Definition]

# Default mode (overridden by the jail's [mode=...] parameter).
mode = 4xx

# Repeated client errors from one IP = probing / enumeration.
mdre-4xx = ^.*"ClientHost":"<HOST>".*"DownstreamStatus":4\d\d.*$

# Known scanner / exploit tooling in the User-Agent.
mdre-bot = ^.*"ClientHost":"<HOST>".*"request_User-Agent":"[^"]*(?:sqlmap|nikto|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|wpscan|acunetix)[^"]*".*$

# <mode> expands to e.g. 4xx, giving <mdre-4xx>, which expands to the regex above.
failregex = <mdre-<mode>>

datepattern = "StartUTC":"%%Y-%%m-%%dT%%H:%%M:%%S
