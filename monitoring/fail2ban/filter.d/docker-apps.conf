# Fail2ban filter for application auth-failures in Docker container logs.
#
# Primary use (journald): the journal message is the plain application line, so
# the failregex below applies directly. Narrow the jail to one container with
# `journalmatch = CONTAINER_NAME=<name>` and tighten the regex to that app's
# exact wording for fewer false positives.
#
# json-file fallback: if the rootless daemon keeps the default json-file driver,
# point the jail at ~/.local/share/docker/containers/*/*-json.log and uncomment
# the prefregex to unwrap Docker's {"log":"...","stream":"...","time":"..."} envelope.
#
# Iterate with:  fail2ban-regex <sample-line> /etc/fail2ban/filter.d/docker-apps.conf

[Definition]

# Unwrap the Docker json-file envelope (ONLY for the json-file fallback; leave
# commented when reading journald).
# prefregex = ^\s*\{"log":"<F-CONTENT>.+</F-CONTENT>","stream":"std(?:out|err)".*\}$

failregex = (?:authentication failure|invalid (?:login|credentials|user)|failed login|login failed|403 Forbidden|Unauthorized)\b.*?(?:from|ip[=: ])\s*<HOST>
            <HOST>\b.*?(?:authentication failure|invalid (?:login|credentials|user)|failed login|login failed|Unauthorized)

ignoreregex =
