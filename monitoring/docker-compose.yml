name: monitoring

services:
  initial-config:
    image: alpine:3.23
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/configure-monitoring.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./victoriametrics:/victoriametrics_src:ro
      - ./fluent-bit:/fluent-bit_src:ro
      - $JOHNCLOUD_ROOT/victoriametrics:/victoriametrics
      - $JOHNCLOUD_ROOT/victorialogs:/victorialogs
      - $JOHNCLOUD_ROOT/victoriatraces:/victoriatraces
      - $JOHNCLOUD_ROOT/fluent-bit:/fluent-bit

  # NOTE: Suricata is NOT here. Sniffing the physical uplink needs CAP_NET_RAW in
  # the init user namespace, which rootless Docker cannot grant (socket() → EPERM).
  # The sensor runs under the rootful daemon from suricata/docker-compose.yml;
  # setup_before_up.sh brings it up. It writes eve.json to the shared logs dir that
  # fluent-bit (below) and host Fail2ban tail.
  pdc:
    # https://grafana.com/docs/grafana-cloud/connect-externally-hosted/private-data-source-connect/#private-data-source-connect-pdc-concepts
    image: grafana/pdc-agent:latest
    container_name: pdc
    depends_on:
      - initial-config
    restart: unless-stopped
    command: ["-token","$GRAFANA_PDC_TOKEN","-cluster","$GRAFANA_PDC_CLUSTER","-gcloud-hosted-grafana-id","$GRAFANA_PDC_GCP_ID"]
    
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    depends_on:
      - initial-config
    volumes:
      - $JOHNCLOUD_ROOT/victorialogs/data:/vlogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
    environment:
      - TZ=$TZ

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    restart: unless-stopped
    container_name: victoriatraces
    depends_on:
      - initial-config
      - pdc
    volumes:
      - $JOHNCLOUD_ROOT/victoriatraces/data:/vtraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:9481"
    environment:
      - TZ=$TZ

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    restart: unless-stopped
    depends_on:
      - initial-config
      - victorialogs
    volumes:
      - ${HOME}/.local/share/docker/containers:/var/lib/docker/containers:ro
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock:ro
      - $JOHNCLOUD_ROOT/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - $JOHNCLOUD_ROOT/fluent-bit/parsers.conf:/fluent-bit/etc/parsers_custom.conf:ro
      - $JOHNCLOUD_ROOT/fluent-bit/container_name.lua:/fluent-bit/etc/container_name.lua:ro
      - $TRAEFIK_LOG_DIR:/var/log/traefik:ro   # Traefik JSON access log (TLS analysis)
      - $JOHNCLOUD_ROOT/suricata/logs:/var/log/suricata:ro
      - $JOHNCLOUD_ROOT/traefik/GeoLite2:/fluent-bit/etc/geoip:ro   # MaxMind GeoLite2 DBs (maintained by core's geoipupdate) for src_ip geo enrichment
    environment:
      - TZ=$TZ

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    depends_on:
      - initial-config
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    depends_on:
      - initial-config
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${XDG_DATA_HOME:-$HOME/.local/share}/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--disable_metrics=advtcp,hugetlb,memory_numa,perf_event,referenced_memory,resctrl,sched,tcp,udp"

  speedtest:
    image: kutovoys/speedtest-exporter
    container_name: speedtest
    restart: unless-stopped
    depends_on:
      - initial-config
    environment:
        - UPDATE_INTERVAL=60
    volumes:
        - $JOHNCLOUD_ROOT/speedtest/data:/config

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    depends_on:
      - initial-config
      - node-exporter
      - cadvisor
      - speedtest
    volumes:
      - $JOHNCLOUD_ROOT/victoriametrics/:/etc/victoriametrics/
      - $JOHNCLOUD_ROOT/victoriametrics/data:/vmdata
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "-promscrape.config=/etc/victoriametrics/victoriametrics.yml"
      - "-storageDataPath=/vmdata"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=12"
    environment:
      - TZ=$TZ

  # fail2ban-ui runs ROOTLESS like the rest of this stack. It does NOT touch the
  # host's root-owned Fail2ban socket (a rootless container would get EACCES on it);
  # instead it drives the host's rootful Fail2ban through the **SSH connector** —
  # it SSHes to the host as a dedicated user that has narrow sudo for fail2ban-client.
  # Configure the server + SSH key in the UI after first start (key persists in
  # /config/.ssh); see Monitoring.md. host.docker.internal lets it reach host sshd.
  fail2ban-ui:
    image: swissmakers/fail2ban-ui:latest
    container_name: fail2ban-ui
    depends_on:
      - initial-config
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host's sshd for the SSH connector
    environment:
      - CONTAINER=true                         # store SSH keys/known_hosts under /config/.ssh
      - TZ=$TZ
      - PORT=${FAIL2BAN_UI_PORT}               # internal listen port; Traefik targets it by name
      # --- Authentik OIDC (native) ---
      - OIDC_ENABLED=true
      - OIDC_PROVIDER=${FAIL2BAN_UI_OIDC_PROVIDER:-authentik}
      - OIDC_ISSUER_URL=${FAIL2BAN_UI_OIDC_ISSUER_URL:-https://authentik.$HOST/application/o/fail2ban-ui/}
      - OIDC_CLIENT_ID=${FAIL2BAN_UI_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${FAIL2BAN_UI_OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=https://fail2ban.$HOST/auth/callback
      - OIDC_ROLE_CLAIM=groups
      - OIDC_ADMIN_ROLES=${FAIL2BAN_UI_OIDC_ADMIN_ROLES}
      - OIDC_SUPPORT_ROLES=${FAIL2BAN_UI_OIDC_SUPPORT_ROLES}
      - OIDC_SESSION_SECRET=${FAIL2BAN_UI_OIDC_SESSION_SECRET}
    volumes:
      - ${JOHNCLOUD_ROOT}/fail2ban-ui:/config  # SQLite DB, settings, SSH keys/known_hosts
    labels:
      - pangolin.public-resources.fail2ban-ui.name=fail2ban-ui
      - pangolin.public-resources.fail2ban-ui.full-domain=fail2ban.$HOST
      - pangolin.public-resources.fail2ban-ui.protocol=http
      - pangolin.public-resources.fail2ban-ui.ssl=true
      - pangolin.public-resources.fail2ban-ui.targets[0].method=http
      - pangolin.public-resources.fail2ban-ui.targets[0].port=${FAIL2BAN_UI_PORT}
      - "homepage.group=Platform"
      - "homepage.name=Fail2ban UI"
      - "homepage.icon=https://raw.githubusercontent.com/swissmakers/fail2ban-ui/dev/pkg/web/static/images/favicon-light.png"
      - "homepage.href=https://fail2ban.$HOST/"
      - "homepage.description=Management platform for operating Fail2Ban"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    