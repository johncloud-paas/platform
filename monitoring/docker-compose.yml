name: monitoring

services:
  suricata:
    image: jasonish/suricata:latest      # OISF community image, ships suricata-update
    container_name: suricata
    restart: unless-stopped
    # Share the host network namespace so the sensor sees eth0 AND every br-* bridge.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      # Uplink interface to capture on. Bridges (br-*/docker0) are auto-discovered.
      - SURICATA_UPLINK=${SURICATA_UPLINK:-eth0}
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - $JOHNCLOUD_ROOT/suricata/entrypoint.sh:/entrypoint.sh:ro
      - $JOHNCLOUD_ROOT/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - $JOHNCLOUD_ROOT/suricata/local.rules:/etc/suricata/local.rules:ro
      - $JOHNCLOUD_ROOT/suricata/rules:/var/lib/suricata/rules
      - $JOHNCLOUD_ROOT/suricata/logs:/var/log/suricata    # eve.json → Fail2ban / EveBox

  pdc:
    # https://grafana.com/docs/grafana-cloud/connect-externally-hosted/private-data-source-connect/#private-data-source-connect-pdc-concepts
    image: grafana/pdc-agent:latest
    container_name: pdc
    restart: unless-stopped
    command: ["-token","$GRAFANA_PDC_TOKEN","-cluster","$GRAFANA_PDC_CLUSTER","-gcloud-hosted-grafana-id","$GRAFANA_PDC_GCP_ID"]
    
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    user: "0:0"
    restart: unless-stopped
    volumes:
      - $JOHNCLOUD_ROOT/victorialogs/data:/vlogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
    environment:
      - TZ=$TZ

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    restart: unless-stopped
    container_name: victoriatraces
    depends_on:
      - pdc
    volumes:
      - $JOHNCLOUD_ROOT/victoriatraces/data:/vtraces
    command:
      - "-storageDataPath=/vtraces"
      - "-httpListenAddr=:9481"
    environment:
      - TZ=$TZ

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    restart: unless-stopped
    depends_on:
      - victorialogs
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - $JOHNCLOUD_ROOT/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - $JOHNCLOUD_ROOT/fluent-bit/container_name.lua:/fluent-bit/etc/container_name.lua:ro
      - $TRAEFIK_LOG_DIR:/var/log/traefik:ro   # Traefik JSON access log (TLS analysis)
    environment:
      - TZ=$TZ

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--disable_metrics=advtcp,hugetlb,memory_numa,perf_event,referenced_memory,resctrl,sched,tcp,udp"

  speedtest:
    image: kutovoys/speedtest-exporter
    container_name: speedtest
    restart: unless-stopped
    environment:
        - UPDATE_INTERVAL=60
    volumes:
        - $JOHNCLOUD_ROOT/speedtest/data:/config

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - node-exporter
      - cadvisor
      - speedtest
    volumes:
      - $JOHNCLOUD_ROOT/victoriametrics/:/etc/victoriametrics/
      - $JOHNCLOUD_ROOT/victoriametrics/data:/vmdata
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "-promscrape.config=/etc/victoriametrics/victoriametrics.yml"
      - "-storageDataPath=/vmdata"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=12"
    environment:
      - TZ=$TZ

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
    