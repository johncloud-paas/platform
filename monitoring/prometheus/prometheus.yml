global:
  scrape_interval: 60m

scrape_configs:
  - job_name: 'speedtest'
    static_configs:
      - targets: ["speedtest:9090"]
    scrape_interval: 60m
    metrics_path: /metrics

  - job_name: 'node'
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: 'cadvisor'
    static_configs:
      - targets: ["cadvisor:8080"]
  