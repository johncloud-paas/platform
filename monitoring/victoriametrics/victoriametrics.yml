global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'speedtest'
    static_configs:
      - targets: ["speedtest:9090"]
    scrape_interval: 60m
    metrics_path: /metrics

  - job_name: 'node'
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s
    max_scrape_size: 134217728
    metric_relabel_configs:
      - action: labeldrop
        regex: "container_label_(com_docker_compose|com_docker_dhi|org_opencontainers)_.*"
        