# fail2ban-ui — web UI for the host Fail2ban ban layer. Runs under the SYSTEM
# (rootful) Docker daemon, NOT the per-user rootless daemon the rest of the
# monitoring stack uses.
#
# Why it can't be rootless:
# The "Local" connector talks to Fail2ban through its control socket
# (/var/run/fail2ban/fail2ban.sock, owned root:root 0600) and edits /etc/fail2ban.
# Both are root-owned, and Fail2ban itself runs rootful on the host. A rootless
# container is confined to its own user namespace, so its root maps to an
# unprivileged host subuid and open() on the socket returns EACCES. Running the UI
# rootful (same rationale as the Suricata sensor next door) is the only way the
# Local connector works.
#
# Launch (from the monitoring/ directory — setup_before_up.sh does this for you):
#   sudo docker compose --env-file .env -f fail2ban-ui/docker-compose.yml up -d \
#        --force-recreate --remove-orphans
#
# Exposure: this is a rootful, host-network container, so Newt (which watches the
# rootless Docker socket) cannot see it and it cannot join the rootless
# traefik-proxy network — pangolin.public-resources.* labels would never register.
# Expose it by registering a Pangolin resource targeting the host IP:$FAIL2BAN_UI_PORT
# (see Monitoring.md). Access is gated by the app's own Authentik OIDC.
name: fail2ban-ui

services:
  fail2ban-ui:
    image: swissmakers/fail2ban-ui:latest
    container_name: fail2ban-ui
    restart: unless-stopped
    # Host network namespace: binds $FAIL2BAN_UI_PORT on the host and lets the
    # host-side Fail2ban action reach the callback endpoint at 127.0.0.1.
    network_mode: host
    environment:
      - CONTAINER=true
      - TZ=$TZ
      - PORT=${FAIL2BAN_UI_PORT}
      - BIND_ADDRESS=0.0.0.0
      # --- Authentik OIDC (native) ---
      - OIDC_ENABLED=true
      - OIDC_PROVIDER=authentik
      - OIDC_ISSUER_URL=${FAIL2BAN_UI_OIDC_ISSUER_URL:-https://authentik.$HOST/application/o/fail2ban-ui/}
      - OIDC_CLIENT_ID=${FAIL2BAN_UI_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${FAIL2BAN_UI_OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=https://fail2ban.$HOST/auth/callback
      - OIDC_ROLE_CLAIM=groups
      - OIDC_ADMIN_ROLES=${FAIL2BAN_UI_OIDC_ADMIN_ROLES}
      - OIDC_SUPPORT_ROLES=${FAIL2BAN_UI_OIDC_SUPPORT_ROLES}
      - OIDC_SESSION_SECRET=${FAIL2BAN_UI_OIDC_SESSION_SECRET}
      # --- Ban/unban event callback (Fail2ban → UI); the app writes its own
      #     action files into /etc/fail2ban using these values. ---
      - CALLBACK_URL=http://127.0.0.1:${FAIL2BAN_UI_PORT}
      - CALLBACK_SECRET=${FAIL2BAN_UI_CALLBACK_SECRET}
    volumes:
      - ${JOHNCLOUD_ROOT}/fail2ban-ui:/config          # SQLite DB, settings, SSH keys
      - /etc/fail2ban:/etc/fail2ban                    # jail/filter config (RW; Local connector)
      - /var/run/fail2ban:/var/run/fail2ban            # Fail2ban control socket
      - /var/log:/var/log:ro                           # log-path validation
