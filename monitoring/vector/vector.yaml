# vector.yaml — collects container logs and exporter metrics and writes them into
# the `monitoring` PostgreSQL database (no TimescaleDB). This replaces the former
# fluent-bit -> VictoriaLogs and VictoriaMetrics path. Mounted read-only into the
# `vector` service; see monitoring/docker-compose.yml.
#
# ${MONITORING_DB_PASSWORD} is interpolated from the container environment.

data_dir: /var/lib/vector

sources:
  # Container logs straight from the Docker daemon. Attaches container_name,
  # container_id, image, stream, message, timestamp and label.* automatically.
  docker_logs:
    type: docker_logs
    exclude_containers: [vector]   # don't ingest our own output (feedback loop)

  # node-exporter (host), cadvisor (containers) and the speedtest exporter.
  # Reachable by container name on the shared traefik-proxy network.
  exporters:
    type: prometheus_scrape
    endpoints:
      - http://node-exporter:9100/metrics
      - http://cadvisor:8080/metrics
      - http://speedtest:9798/metrics
    scrape_interval_secs: 30       # longer interval keeps the PG insert volume sane

transforms:
  # Shape docker logs into the `logs` table columns and derive the criticity.
  # Docker carries no severity, so we parse it out of the message (JSON `level`/
  # `severity`, then logfmt `level=`), defaulting to "unknown".
  container_logs:
    type: remap
    inputs: [docker_logs]
    source: |
      .container = .container_name
      .message = to_string(.message) ?? ""

      # Match a JSON `"level"/"severity":"..."` or a logfmt `level=...` token.
      .severity = "unknown"
      matched = parse_regex(.message, r'(?i)(?:"(?:level|severity)"\s*:\s*"|\blevel=)(?P<lvl>[a-z]+)') ?? null
      if matched != null {
        .severity = get(value: {
          "trace": "trace",
          "debug": "debug", "dbg": "debug",
          "info": "info", "inf": "info", "notice": "info",
          "warn": "warning", "warning": "warning",
          "err": "error", "error": "error",
          "crit": "critical", "critical": "critical",
          "fatal": "fatal", "emerg": "fatal", "panic": "fatal"
        }, path: [downcase(to_string(matched.lvl))]) ?? "unknown"
      }

      # Keep only the logs columns. Extra fields would be ignored by the sink, but
      # trimming keeps batches small.
      . = {
        "timestamp": .timestamp,
        "container": .container,
        "severity": .severity,
        "message": .message,
        "stream": .stream,
        "image": .image,
        "labels": .label
      }

sinks:
  pg_logs:
    type: postgres
    inputs: [container_logs]
    endpoint: "postgresql://monitoring:${MONITORING_DB_PASSWORD}@core-db-1:5432/monitoring"
    table: logs
    batch:
      max_events: 1000
      timeout_secs: 5

  pg_metrics:
    type: postgres
    inputs: [exporters]
    endpoint: "postgresql://monitoring:${MONITORING_DB_PASSWORD}@core-db-1:5432/monitoring"
    table: metrics
    batch:
      max_events: 1000
      timeout_secs: 5
