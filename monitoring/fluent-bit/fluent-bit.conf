[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  10
    DB                /tmp/fluent-bit-docker.db

[FILTER]
    Name   modify
    Match  docker.*
    Rename log _msg

[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/container_name.lua
    call   extract_container_name

[OUTPUT]
    Name          loki
    Match         docker.*
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=fluent-bit
    Label_Keys    $container_name,$log_level
    Line_Format   json
