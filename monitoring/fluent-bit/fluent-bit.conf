[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  10
    DB                /tmp/fluent-bit-docker.db

[FILTER]
    Name   modify
    Match  docker.*
    Rename log _msg

[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/container_name.lua
    call   extract_container_name

[OUTPUT]
    Name          loki
    Match         docker.*
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=fluent-bit
    Label_Keys    $container_name,$log_level
    Line_Format   json

# --- Traefik access log (TLS + tunnel-delivered app traffic) ----------------
# See Traefik-Log-Analysis.md. Requires $TRAEFIK_LOG_DIR mounted at /var/log/traefik.
[INPUT]
    Name              tail
    Tag               traefik.access
    Path              /var/log/traefik/access.log
    Parser            json
    Refresh_Interval  10
    DB                /tmp/fluent-bit-traefik.db

[OUTPUT]
    Name          loki
    Match         traefik.access
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=traefik
    Label_Keys    $RequestHost
    Line_Format   json

[INPUT]
    Name              tail
    Tag               suricata.eve
    Path              /var/log/suricata/eve.json
    Parser            json
    Refresh_Interval  10
    DB                /tmp/fluent-bit-suricata.db

[OUTPUT]
    Name          loki
    Match         suricata.eve
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=suricata
    Label_Keys    $event_type,$src_ip
    Match         suricata.eve
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=suricata
    Label_Keys    $event_type,$src_ip
    Line_Format   json
    