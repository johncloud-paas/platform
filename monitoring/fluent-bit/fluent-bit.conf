[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    Parsers_File /fluent-bit/etc/parsers_custom.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  10
    DB                /tmp/fluent-bit-docker.db

[FILTER]
    Name   modify
    Match  docker.*
    Rename log _msg

[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/container_name.lua
    call   extract_container_name

[OUTPUT]
    Name          loki
    Match         docker.*
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push
    Labels        job=fluent-bit
    Label_Keys    $container_name,$log_level
    Line_Format   json

# --- Traefik access log (TLS + tunnel-delivered app traffic) ----------------
# See Traefik-Log-Analysis.md. Requires $TRAEFIK_LOG_DIR mounted at /var/log/traefik.
[INPUT]
    Name              tail
    Tag               traefik.access
    Path              /var/log/traefik/access.log
    Parser            json_notime
    Refresh_Interval  10
    DB                /tmp/fluent-bit-traefik.db

[OUTPUT]
    Name          loki
    Match         traefik.access
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push?_msg_field=RequestPath&_time_field=StartUTC
    Labels        job=traefik
    Label_Keys    $RequestHost
    Line_Format   json

[INPUT]
    Name              tail
    Tag               suricata.eve
    Path              /var/log/suricata/eve.json
    Parser            json_notime
    Refresh_Interval  10
    DB                /tmp/fluent-bit-suricata.db

[FILTER]
    Name   lua
    Match  suricata.eve
    script /fluent-bit/etc/container_name.lua
    call   suricata_message

# GeoIP enrichment for the source IP. Suricata's eve.json carries src_ip on every
# alert/flow/http/dns/tls/anomaly record but no geo data; we resolve it against the
# MaxMind GeoLite2-City DB (same file core's geoipupdate keeps fresh, mounted at
# /fluent-bit/etc/geoip). Only public src_ip values resolve — private/internal IPs
# (10.*/172.16-31.*/192.168.*) are left unenriched, and records without src_ip
# (e.g. stats) pass through untouched. latitude/longitude land as numeric fields
# ready for a Grafana geomap.
[FILTER]
    Name       geoip2
    Match      suricata.eve
    Database   /fluent-bit/etc/geoip/GeoLite2-City.mmdb
    Lookup_key src_ip
    Record     src_country      src_ip %{country.names.en}
    Record     src_country_code src_ip %{country.iso_code}
    Record     src_latitude     src_ip %{location.latitude}
    Record     src_longitude    src_ip %{location.longitude}

[OUTPUT]
    Name          loki
    Match         suricata.eve
    Host          victorialogs
    Port          9428
    URI           /insert/loki/api/v1/push?_msg_field=event_msg&_time_field=timestamp
    Labels        job=suricata
    Label_Keys    $event_type,$src_ip
    Line_Format   json
    