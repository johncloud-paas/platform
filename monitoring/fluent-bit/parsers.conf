# Custom parsers. Loaded in addition to the image's default
# /fluent-bit/etc/parsers.conf (which still provides `docker`, etc.).

# JSON parser that does NOT extract a time key. Traefik's access log carries a
# `time` field in ISO-8601 (e.g. 2026-10-09T14:56:51+02:00), which the stock
# `json` parser tries to read with an Apache-style Time_Format and fails on.
# We let VictoriaLogs pick the timestamp instead (see the OUTPUT _time_field
# query args: StartUTC for Traefik, timestamp for Suricata).
[PARSER]
    Name   json_notime
    Format json
