# suricata-update disable list — trims ET Open to what this headless Linux PaaS
# needs (tiers A+B+C). Each line matches an ET category by the prefix in a rule's
# msg (Python regex; \b is a word boundary, so "ET SCADA\b" == "ET SCADA " but
# survives editors that strip trailing whitespace). Disables ~15,700 rules
# (~37,600 remain, -29%; a few stay enabled for flowbit dependencies).
# Rationale + counts: Monitoring.md §12.1. Re-enable a category by
# deleting its line and redeploying (./startstack.sh ./monitoring).
#
# Only affects downloaded ET rules; our local.rules (msgs start "LOCAL ...") is
# loaded separately and untouched.

# A: platforms/protocols this host doesn't run, plus retired rules
re:msg:"ET SCADA\b
re:msg:"ET GAMES\b
re:msg:"ET VOIP\b
re:msg:"ET CHAT\b
re:msg:"ET P2P\b
re:msg:"ET FILE_SHARING\b
re:msg:"ET INAPPROPRIATE\b
re:msg:"ET NETBIOS\b
re:msg:"ET RETIRED\b

# B: informational/noise that never reaches severity 1 (no Fail2ban bans)
re:msg:"ET TOR\b
re:msg:"ET DYN_DNS\b
re:msg:"ET INFO\b

# C: endpoint/mobile/desktop malware unlikely on a headless Linux server
re:msg:"ET MOBILE_MALWARE\b
re:msg:"ET ACTIVEX\b
re:msg:"ET ADWARE_PUP\b
re:msg:"ET HUNTING\b
