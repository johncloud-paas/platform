# /etc/teleport/teleport-node.yaml
version: v3
teleport:
  nodename: ${HOST}
  data_dir: /var/lib/teleport
  join_params:
    token_name: yyyyyy
    method: token
  proxy_server: localhost:3080
  log:
    output: stderr
    severity: INFO
    format:
      output: text
  ca_pin: "xxxxx"
  diag_addr: ""
auth_service:
  enabled: "no"
ssh_service:
  enabled: "yes"
proxy_service:
  enabled: "no"
  https_keypairs: []
  https_keypairs_reload_interval: 0s
  acme: {}
